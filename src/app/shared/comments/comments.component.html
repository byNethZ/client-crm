<div>
  <div *ngFor="let comment of comments">
    <div
      class="d-flex align-items-center justify-content-between flex-wrap px-3 py-2 border-bottom"
    >
      <div class="d-flex align-items-center">
        <div class="me-2">
          <img
            src="{{comment.user?.avatar ? comment.user?.avatar : 'https://via.placeholder.com/36x36'}}"
            alt="Avatar"
            class="rounded-circle img-xs"
          />
        </div>
        <div class="d-flex align-items-center">
          <p class="text-body">
            {{ comment.user?.name }} {{ comment.user?.lastname }}
          </p>
        </div>
      </div>
      <div class="tx-13 text-muted mt-2 mt-sm-0">
        {{ comment.created_at | date }}
      </div>
    </div>
    <div class="p-4 border-bottom" [innerHtml]="comment.comment">
    </div>
  </div>
</div>

<quill-editor
  [(ngModel)]="htmlText"
  placeholder="Enter Text"
  [modules]="quillConfig"
  (onSelectionChanged)="onSelectionChanged($event)"
  (onContentChanged)="onContentChanged($event)"
>
</quill-editor>

<button class="btn btn-primary" (click)="save()">{{!charging ? 'Guardar' : 'Guardando...'}}</button>
