<div class="row">

  <div class="col-12 col-xl-3 grid-margin stretch-card" *ngIf="utils.setButtonsPermissions(6, departament_id, departament_alt_id, role_id)">
    <button routerLink="/design/checklists" class="btn button-dashboard">
      <div class="card overflow-hidden">
        <div class="card-body text-center">
          <h5>Checklist Menus</h5>
          <i data-feather="link" appFeatherIcon></i>
        </div>
      </div>
    </button>
  </div>

  <div class="col-12 col-xl-3 grid-margin stretch-card" *ngIf="utils.setButtonsPermissions(4, departament_id, departament_alt_id, role_id)">
    <button routerLink="/tools/create-customer" class="btn button-dashboard">
      <div class="card overflow-hidden">
        <div class="card-body text-center">
          <h5>Nuevo Prospecto</h5>
          <i data-feather="user-plus" appFeatherIcon></i>
        </div>
      </div>
    </button>
  </div>

  <div class="col-12 col-xl-3 grid-margin stretch-card" *ngIf="role_id === 1">
    <button routerLink="/admin/create-user" class="btn button-dashboard">
      <div class="card overflow-hidden">
        <div class="card-body text-center">
          <h5>Nuevo Usuario</h5>
          <i data-feather="user-plus" appFeatherIcon></i>
        </div>
      </div>
    </button>
  </div>

</div>
