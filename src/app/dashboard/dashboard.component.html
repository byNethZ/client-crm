<div class="slider-dashboard my-3">
  <ngb-carousel
    *ngIf="images"
    [interval]="9000"
    [showNavigationArrows]="false"
    [showNavigationIndicators]="false"
  >
    <ng-template ngbSlide *ngFor="let image of images">
      <div class="picsum-img-wrapper image-slider-container">
        <img
          [src]="image"
          class="d-block w-100 image-slider"
          alt="Random slide"
        />
      </div>
    </ng-template>
  </ngb-carousel>
  <div class="content-slider">
    <div>
      <h6>Hola</h6>
      <h4>{{ name }}</h4>
      <p>{{ date | date: "shortDate" }}</p>
    </div>
    <div class="hours">
      <div class="mx-sm-4">
        <p>Chattanooga</p>
        <h6>{{ hourChat }}</h6>
      </div>
      <div class="mx-sm-4 d-none d-sm-block">
        <p>CDMX</p>
        <h6>{{ hourCDMX }}</h6>
      </div>
      <div class="mx-sm-4 d-none d-sm-block">
        <p>Sonora</p>
        <h6>{{ hourSin }}</h6>
      </div>
      <div class="mx-sm-4 d-none d-sm-block">
        <p>Cancún</p>
        <h6>{{ hourCNCN }}</h6>
      </div>
    </div>
  </div>
</div>

<!-- row -->

<app-buttons-dashboard></app-buttons-dashboard>

<app-admin *ngIf="departamentUser && departamentUser === 1 || departamentAltUser && departamentAltUser === 1"></app-admin>
<app-design *ngIf="departamentUser && departamentUser === 6 || departamentAltUser && departamentAltUser === 6"></app-design>
<app-sales *ngIf="departamentUser && departamentUser === 4 || departamentAltUser && departamentAltUser === 4"></app-sales>
