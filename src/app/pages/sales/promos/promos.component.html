<div class="row">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Data Table</h6>
        <div class="table-responsive">
          <div class="mb-3">
            <input (keyup)="applyFilter($event)" type="text" class="form-control" id="exampleInputUsername1" autocomplete="off" placeholder="Filtrar por Vendedor">
          </div>
          <div class="mb 3">
            <p class="text-success">Verde para regalos entregados</p>
            <p >Negro para regalos pendientes</p>
            <p >Click sobre el teléfono o el email para copiarlos</p>
          </div>
          <table id="dataTableCustomer" class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Teléfono</th>
                <th>Regalo</th>
                <th>Email</th>
                <th>Asesor</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let promo of promosFiltered" class="{{promo.delivered ? 'text-success' : ''}}">
                <td>{{promo.name}}</td>
                <td>{{promo.lastname}}</td>
                <td (click)="saveClipboard(promo.phone)" class="cursor-pointer">{{promo.phone}}</td>
                <td>{{promo.gift}}</td>
                <td (click)="saveClipboard(promo.email)" class="cursor-pointer">{{promo.email}}</td>
                <td>{{promo.asesor}}</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
