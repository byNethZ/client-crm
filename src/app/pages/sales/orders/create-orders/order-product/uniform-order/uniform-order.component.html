<form [formGroup]="formUniforms" (ngSubmit)="addProduct()">
  <div class="row mb-3">
    <div class="col-lg-6">
      <label class="col-form-label text-sm col-12" for="name">Modelo #</label>
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="name"
          matInput
          [formControl]="controlProduct"
          [matAutocomplete]="autocompleteProduct"
          required
          placeholder="Nombre"
          [ngClass]="
            formUniforms.get('name')?.errors?.required ? 'is-invalid' : ''
          "
        />
        <mat-autocomplete
          autoActiveFirstOption
          #autocompleteProduct="matAutocomplete"
          [displayWith]="displayFn"
          (optionSelected)="OnProductSelected($event.option)"
        >
          <mat-option
            *ngFor="let product of filProducts | async"
            [value]="product"
          >
            {{ product.name }}
          </mat-option>
        </mat-autocomplete>
      </div>
    </div>
    <div class="col-lg-3">
      <label class="col-form-label text-sm col-12" for="name"
        >Tipo de uniforme</label
      >
      <div class="form-check mb-2">
        <input
          type="radio"
          class="form-check-input"
          id="type"
          name="type"
          value="1"
          formControlName="type"
          required
          [ngClass]="
            formUniforms.get('type')?.errors?.required ? 'is-invalid' : ''
          "
        />
        <label class="form-check-label" for="type">Embroidery</label>
      </div>
      <div class="form-check mb-2">
        <input
          type="radio"
          class="form-check-input"
          id="type"
          name="type"
          value="2"
          formControlName="type"
          required
          [ngClass]="
            formUniforms.get('type')?.errors?.required ? 'is-invalid' : ''
          "
        />
        <label class="form-check-label" for="type">Transfer</label>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-lg-6">
      <label class="col-form-label text-sm col-12" for="color">Color</label>
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="color"
          required
          placeholder="Color"
          formControlName="color"
          [ngClass]="
            formUniforms.get('color')?.errors?.required ? 'is-invalid' : ''
          "
        />
      </div>
    </div>
  </div>

  <div class="row mb-3 d-flex justify-content-between">
    <div class="col-lg-9 d-lg-flex">
      <div class="col-lg-2" *ngFor="let input of inputs">
        <label class="col-form-label text-sm col-12" [for]="input.value">
          {{ input.name }}
        </label>
        <div class="col-12">
          <input
            type="number"
            class="form-control col-12"
            [id]="input.value"
            [formControlName]="input.value"
            placeholder="0"
            (keyup)="calculateTotal()"
          />
        </div>
      </div>
    </div>
    <div class="col-lg-2">
      <label class="col-form-label text-sm col-12" for="total_units"
        >Total</label
      >
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="total_units"
          placeholder="0"
          formControlName="total_units"
        />
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-lg-10">
      <label class="col-form-label text-sm col-12" for="description"
        >Descripción</label
      >
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="description"
          placeholder="Descripción o Notas"
          formControlName="description"
        />
      </div>
    </div>
    <div class="col-lg-2">
      <label class="col-form-label text-sm col-12" for="unit_price"
        >Precio unitario</label
      >
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="unit_price"
          placeholder="0"
          formControlName="unit_price"
          [ngClass]="
            formUniforms.get('unit_price')?.errors?.required ? 'is-invalid' : ''
          "
        />
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-lg-10"></div>
    <div class="col-lg-2">
      <label class="col-form-label text-sm col-12" for="unit_price"
        >Subtotal del producto</label
      >
      <div class="col-12">
        <input
          type="text"
          class="form-control col-12"
          id="unit_price"
          placeholder="0"
          formControlName="subtotal"
        />
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center col-12">
    <button class="btn btn-primary" type="submit">Agregar</button>
  </div>
</form>
