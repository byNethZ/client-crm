<div *ngIf="selectedCategory">
  <!-- Add Button -->
  <ng-container
    *ngIf="formProductSubmitted"
    class="w-100 d-flex justify-content-center mb-7"
  >
    <i
      (click)="clearData()"
      class="link-icon plus-product cursor-pointer"
      [attr.data-feather]="'plus'"
      [attr.width]="60"
      [attr.height]="60"
      appFeatherIcon
    ></i>
  </ng-container>
  <!-- End Add Button -->
  <!-- Form -->
  <div *ngIf="!formProductSubmitted">
    <!-- Form Uniform Product -->
    <div class="row col-md-8 grid-margin stretch-card mx-auto">
      <div class="card">
        <div class="card-body" *ngIf="selectedCategory === 1">
          <h6 class="card-title">Uniformes</h6>

          <div>
            <app-uniform-order [products]="productsByCat"></app-uniform-order>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- End Form -->
</div>
<!-- End Form and Add Button Section -->
<!-- Selection of Product's Type -->
<div *ngIf="!selectedCategory">
  <div class="row">
    <div *ngFor="let choice of departaments; let i = index" class="col-lg-4">
      <input
        id="{{ choice.category }}"
        name="product"
        type="radio"
        class="input__product"
        [value]="choice.id"
        (change)="onCheckChange($event)"
      />
      <label
        for="{{ choice.category }}"
        class="card mb-2 p-3 card-departaments form-check-label {{
          choice.category.toLowerCase()
        }} "
      >
        <img src="{{ choice.img_url }}" alt="{{ choice.category }}" />
      </label>
    </div>
  </div>
</div>
