<layout-restringed></layout-restringed>
<aw-wizard #wizardForm>
  <aw-wizard-step stepTitle="step 1">
    <div class="m-auto w-75 mt-5 text-center">
      <div class="row mb-3">
        <label for="bussiness" class="col-form-label"
          >Busca a tu cliente por Negocio</label
        >
        <div class="col-sm-9 m-auto">
          <input
            id="bussiness"
            class="form-control"
            type="text"
            matInput
            [formControl]="controlCustomer"
            [matAutocomplete]="autocompleteCustomer"
            placeholder="Nombre del Negocio"
            required
          />
          <mat-autocomplete
            autoActiveFirstOption
            #autocompleteCustomer="matAutocomplete"
            [displayWith]="displayFnCust"
            (optionSelected)="OnCustomerSelected($event.option)"
          >
            <mat-option
              *ngFor="let customer of filCustomers | async"
              [value]="customer"
            >
              {{ customer.business }}
            </mat-option>
          </mat-autocomplete>
          <div
            *ngIf="isCustomerDataSubmitted && customerData.invalid"
            class="invalid-feedback"
          >
            Requerido
          </div>
        </div>
      </div>
      <form
        (ngSubmit)="customerSubmit($event)"
        [formGroup]="customerData"
        class="m-auto w-75 mt-5 text-center"
      >
        <!-- <div class="m-3 justify-content-center text-center" *ngIf="customerSelected"> -->
        <div class="m-3 justify-content-center text-center">
          <div class="row mb-3">
            <div class="col-7">
              <label
                for="name"
                class="col-12 col-form-label text-sm"
                [ngClass]="
                  customerData.get('name')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >Nombre</label
              >
              <div class="col-12">
                <input
                  type="text"
                  class="form-control"
                  [ngClass]="
                    customerData.get('name')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="name"
                  formControlName="name"
                  required
                  placeholder="Nombre"
                />
              </div>
            </div>
            <div class="col-5">
              <label
                for="phone"
                class="col-12 col-form-label text-sm"
                [ngClass]="
                  customerData.get('phone')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >Telefono</label
              >
              <div class="col-12">
                <input
                  type="phone"
                  class="form-control"
                  [ngClass]="
                    customerData.get('phone')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="phone"
                  formControlName="phone"
                  required
                  placeholder="+1(XXX) XXXX XXXX"
                />
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-7">
              <label
                for="email"
                class="col-12 col-form-label text-sm"
                [ngClass]="
                  customerData.get('email')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >E-Mail</label
              >
              <div class="col-12">
                <input
                  type="text"
                  class="form-control"
                  [ngClass]="
                    customerData.get('email')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="email"
                  formControlName="email"
                  required
                  placeholder="E-Mail"
                />
              </div>
            </div>
            <div class="col-5">
              <label
                for="alternative_phone"
                class="col-12 col-form-label text-sm"
                >Telefono Alternativo</label
              >
              <div class="col-12">
                <input
                  type="alternative_phone"
                  class="form-control"
                  id="alternative_phone"
                  formControlName="alternative_phone"
                  placeholder="+1(XXX) XXXX XXXX"
                />
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-7">
              <label
                for="shipping_address"
                class="col-12 col-form-label"
                [ngClass]="
                  customerData.get('shipping_address')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >Dirección de Envío</label
              >
              <div class="col-12">
                <input
                  type="text"
                  class="form-control"
                  [ngClass]="
                    customerData.get('shipping_address')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="shipping_address"
                  formControlName="shipping_address"
                  required
                  placeholder="Dirección de Envío"
                />
              </div>
            </div>
            <div class="col-5">
              <label class="col-12 mt-2" for="">Enviar a</label>
              <button
                (click)="changeToOfficeAddress()"
                [disabled]="!customerSelected"
                type="button"
                class="btn btn-primary mt-2"
              >
                Oficina
              </button>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-lg-6">
              <label
                for="shipping_state_id"
                class="col-12 col-form-label"
                [ngClass]="
                  customerData.get('shipping_state_id')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >Estado de Envío</label
              >
              <div class="col-12">
                <select
                  type="shipping_state_id"
                  class="form-control"
                  [ngClass]="
                    customerData.get('shipping_state_id')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="shipping_state_id"
                  formControlName="shipping_state_id"
                  required
                >
                  <option value="" disabled selected>
                    Selecciona un Estado
                  </option>
                  <option *ngFor="let state of states" [value]="state.id">
                    {{ state.state_name }}
                  </option>
                </select>
              </div>
            </div>
            <div class="col-lg-6">
              <label
                for="shipping_zipcode"
                class="col-12 col-form-label"
                [ngClass]="
                  customerData.get('shipping_zipcode')?.errors?.required
                    ? 'text-danger'
                    : ''
                "
                >Código Postal</label
              >
              <div class="col-12">
                <input
                  type="shipping_zipcode"
                  class="form-control"
                  [ngClass]="
                    customerData.get('shipping_zipcode')?.errors?.required
                      ? 'is-invalid'
                      : ''
                  "
                  id="shipping_zipcode"
                  formControlName="shipping_zipcode"
                  required
                  placeholder="Código Postal"
                />
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <label
              for="address_on_product"
              class="col-12 col-form-label"
              [ngClass]="
                customerData.get('address_on_product')?.errors?.required
                  ? 'text-danger'
                  : ''
              "
              >Dirección en el producto</label
            >
            <div class="col-12">
              <input
                type="text"
                class="form-control"
                [ngClass]="
                  customerData.get('address_on_product')?.errors?.required
                    ? 'is-invalid'
                    : ''
                "
                id="address_on_product"
                formControlName="address_on_product"
                required
                placeholder="Dirección en el Producto"
              />
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-center mt-2">
          <button
            [disabled]="!customerSelected"
            class="btn btn-success"
            type="submit"
          >
            Continuar
          </button>
        </div>
      </form>
      <div class="mt-5">
        <p>O guardar un</p>
        <div class="d-flex justify-content-center mt-2">
          <button
            class="btn btn-primary"
            type="button"
            routerLink="/sales/customers/new"
          >
            Nuevo Cliente
          </button>
        </div>
      </div>
    </div>
  </aw-wizard-step>

  <aw-wizard-step stepTitle="step 2">
    <form (ngSubmit)="orderSubmit()" [formGroup]="orderData">
      <order-product
        [token]="token"
        [productsOrder]="productsOrder"
        (productOrderedEmitter)="addProductReceiver($event)"
      ></order-product>
      <div class="d-flex justify-content-center mt-2">
        <button class="btn btn-secondary me-2" type="button" awPreviousStep>
          Back
        </button>
        <button class="btn btn-primary" type="submit">Continue</button>
      </div>
    </form>
  </aw-wizard-step>

  <aw-wizard-step stepTitle="finish">
    <div class="text-center">
      <i
        data-feather="check-circle"
        appFeatherIcon
        class="text-success mt-4 mb-2 icon-xxl"
      ></i>
      <h3 class="text-muted mb-3">Confirmación de orden</h3>
      <p class="w-75 mx-auto mb-4 text-muted">
        Por favor, confirma los datos de la orden. Si todo es correcto presiona
        en Ordenar.
      </p>
    </div>
    <div class="d-flex justify-content-center mt-2">
      <button class="btn btn-secondary me-2" type="button" awPreviousStep>
        Atras
      </button>
      <button class="btn btn-success" type="button" (click)="finishFunction()">
        Ordenar
      </button>
    </div>
  </aw-wizard-step>
</aw-wizard>
