<div class="card m-3">
  <div class="card-body">
    <h6 class="card-title">Crear Enlace</h6>

    <form [formGroup]="form" (ngSubmit)="save($event)" class="forms-sample">
      <div class="row">
        <div class="col-lg-6">
          <div class="row">
            <div class="col-lg-8">
              <label for="customer-database" class="form-label"
                >Buscar negocio en la base de datos</label
              >
              <!-- Mat Autocomplete for clients database in future -->
              <input
                class="form-control"
                type="text"
                name="customer-database"
                placeholder="Nombre del negocio"
                matInput
                [formControl]="controlCust"
                [matAutocomplete]="autocust"
              />
              <mat-autocomplete
                autoActiveFirstOption
                #autocust="matAutocomplete"
                [displayWith]="displayFnCust"
                (optionSelected)="OnCustomerSelected($event.option)"
              >
                <mat-option
                  *ngFor="let customer of filCustomers | async"
                  [value]="customer"
                >
                  {{ customer.business }}
                </mat-option>
              </mat-autocomplete>
            </div>
            <div class="col-lg-4 d-flex justify-center align-items-center">
              <button
                type="button"
                class="btn btn-primary"
                (click)="cleanCustomer()"
              >
                Limpiar cliente seleccionado
              </button>
            </div>
          </div>
          <div *ngIf="!customerSelected">
            <label for="customer" class="form-label">Escribir Cliente</label>
            <input
              type="text"
              class="form-control"
              id="customer"
              placeholder="Cliente"
              formControlName="customer"
            />
          </div>
        </div>
        <div class="col-lg-6">
          <label class="form-label" for="type">Tipo de checklist</label>
          <select
            formControlName="type"
            class="form-control"
            name="type"
            id="type"
          >
            <option value="menu">Menú</option>
            <option value="cover">Cover</option>
            <option value="canvas">Canvas</option>
          </select>
        </div>
      </div>
      <div class="m-3" *ngIf="customerSelected">
        <div class="row">
          <div class="col-lg-6">
            <h4>{{ customerSelected.name }}</h4>
          </div>
          <div class="col-lg-6">
            <p>{{ customerSelected.surname }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <p>{{ customerSelected.address }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-6">
            <h4>{{ customerSelected.phone }}</h4>
          </div>
          <div class="col-lg-6">
            <p>{{ customerSelected.email }}</p>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label for="urldropbox" class="form-label">Enlace Drive/Dropbox</label>
        <input
          type="text"
          class="form-control"
          id="urldropbox"
          placeholder="urldropbox"
          formControlName="urldropbox"
        />
      </div>
      <div class="mb-3">
        <label for="notes" class="form-label"
          >Notas / Observaciones (Opcional)
        </label>
        <input
          type="text"
          class="form-control"
          id="notes"
          placeholder="Anota cualquier observación que desees, el cliente no verá esta información"
          formControlName="notes"
        />
      </div>
      <button type="submit" class="btn btn-primary me-2">Crear</button>
    </form>
  </div>
</div>
