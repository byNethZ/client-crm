<div class="row">
  <button class="btn btn-success col-lg-2 m-2" routerLink="/admin/create-user">Nuevo Usuario</button>
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Clientes</h6>
        <div class="table-responsive">
          <div class="mb-3">
            <input (keyup)="applyFilter($event)" type="text" class="form-control" id="exampleInputUsername1" autocomplete="off" placeholder="Filtrar por Nombre">
          </div>
          <table id="dataTableCustomer" class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Departamento</th>
                <th *ngIf="role === 2">Admin</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of usersFiltered" class="cursor-pointer {{user.role_id === 1 ? 'text-success' : ''}}">
                <td routerLink="/admin/team/{{user.id}}">{{user.name}}</td>
                <td routerLink="/admin/team/{{user.id}}">{{user.lastname}}</td>
                <td routerLink="/admin/team/{{user.id}}">{{user.email}}</td>
                <td routerLink="/admin/team/{{user.id}}">{{user.departament.name}}</td>
                <td *ngIf="role === 1">
                  <button class="btn btn-danger m-1" (click)="deleteUser(user.id)" >Eliminar</button>
                  <button class="btn btn-primary m-1" routerLink="/admin/edit-user/{{user.id}}" >Editar</button>
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
