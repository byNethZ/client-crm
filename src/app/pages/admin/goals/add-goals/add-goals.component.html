<div class="p-2">
  <card-profile
    [avatar]="vendor.avatar"
    [name]="vendor.name"
    [role_id]="vendor.role_id"
  ></card-profile>
  <form [formGroup]="form" *ngIf="showInputs; else noInputs">
    <div class="col-lg-12 my-2">
      <label class="form-label" for="month">Cantidad</label>
      <input formControlName="inputValueQuantity" class="form-control" type="number">
    </div>
    <div class="col-lg-12 my-2">
      <label class="form-label" for="month">Prospecto</label>
      <input formControlName="inputValueProspect" class="form-control" type="number">
    </div>
    <button (click)="saveGoal()" class="btn btn-success">Guardar</button>
  </form>
  <ng-template #noInputs>
    <div class="d-flex align-content-center justify-content-center h-100">
      <img class="loading" *ngIf="charging" src="{{utils.returnUrlImage('assets/images/utils/loading.gif', 'asset')}}" alt="charging">
      <p class="my-1 align-self-center" *ngIf="!charging">Metas actualizadas</p>
    </div>
  </ng-template>
</div>
