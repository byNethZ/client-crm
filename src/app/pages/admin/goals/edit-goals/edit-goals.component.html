<h3 class="text-center">Estás editando las metas de:</h3>

<ng-container *ngIf="charged">
  <card-profile
    [avatar]="user.avatar"
    [name]="user.name"
    [role_id]="user.role_id"
  ></card-profile>

  <div class="row">
    <div class="col-md-6 stretch-card">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title text-center">Cantidad</h6>
          <form [formGroup]="quantityForm" class="table-responsive">
            <table id="dataTableCustomer" class="table">
              <thead>
                <tr>
                  <th>Mes</th>
                  <th>Meta Asignada</th>
                  <th>Resultados</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td></td>
                </tr>
              </tbody>
              <tfoot>
                <tr *ngFor="let month of months; let i = index">
                  <th>{{ month }}</th>
                  <th>
                    <input
                      id="{{ utils.formatMonthForGoal(i, 'goal') }}"
                      type="number"
                      class="form-control"
                      formControlName="{{
                        utils.formatMonthForGoal(i, 'goal')
                      }}"
                    />
                  </th>
                  <th>
                    <input
                      id="{{ utils.formatMonthForGoal(i, 'result') }}"
                      type="number"
                      class="form-control"
                      formControlName="{{
                        utils.formatMonthForGoal(i, 'result')
                      }}"
                    />
                  </th>
                </tr>
              </tfoot>
            </table>
          </form>
        </div>
      </div>
    </div>
    <div class="col-md-6 stretch-card">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title text-center">Prospectos</h6>
          <form [formGroup]="prospectForm" class="table-responsive">
            <table id="dataTableCustomer" class="table">
              <thead>
                <tr>
                  <th class="d-block d-md-none">Mes</th>
                  <th>Meta Asignada</th>
                  <th>Resultados</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td></td>
                </tr>
              </tbody>
              <tfoot>
                <tr *ngFor="let month of months; let i = index">
                  <th class="d-block d-md-none">{{ month }}</th>
                  <th>
                    <input
                      id="{{ utils.formatMonthForGoal(i, 'goal') }}"
                      type="number"
                      class="form-control"
                      formControlName="{{
                        utils.formatMonthForGoal(i, 'goal')
                      }}"
                    />
                  </th>
                  <th>
                    <input
                      id="{{ utils.formatMonthForGoal(i, 'result') }}"
                      type="number"
                      class="form-control"
                      formControlName="{{
                        utils.formatMonthForGoal(i, 'result')
                      }}"
                    />
                  </th>
                </tr>
              </tfoot>
            </table>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center">
    <button class="btn btn-success my-2" (click)="openModal(confirmationModal)">Guardar</button>
  </div>
</ng-container>


<ng-template #confirmationModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Confirmación de guardado</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <p>Confirmas el cambio de las metas de {{user.name}}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="modal.close('by: close button')">Cancelar</button>
    <button type="button" class="btn btn-success" (click)="submitForm()">Guardar</button>
  </div>
</ng-template>
