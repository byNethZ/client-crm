<div class="col-xl-12 grid-margin grid-margin-xl-0 stretch-card">
  <div class="card">
    <div class="card-body">
      <h6 class="card-title">Métricas</h6>
      <canvas
        baseChart
        [data]="groupedBarChartData"
        [options]="groupedBarChartOptions"
        type="bar"
      >
      </canvas>
    </div>
  </div>
</div>

<div class="cards-clients">
  <div class="row justify-content-center">
    <div
      class="card text-center col-3-clients m-2 p-0"
      *ngFor="let vendor of vendors"
      (click)="createGoal(vendor.id)"
    >
      <card-profile
        [avatar]="vendor.avatar"
        [name]="vendor.name"
        [role_id]="vendor.role_id"
      ></card-profile>
    </div>
  </div>
</div>
